<!DOCTYPE html>
<html>
<head>
    <title>ESP32 Android Fix</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #terminal { background: #000; color: #0f0; height: 300px; overflow-y: scroll; 
                    text-align: left; padding: 10px; font-family: monospace; margin-top: 10px; }
        button { padding: 15px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h3>ESP32 USB Direct Access</h3>
    <p>Nếu không thấy cổng COM, hãy nhấn nút dưới đây</p>
    <button id="btnConnect">Kết nối trực tiếp USB</button>
    <div id="terminal"></div>

<script>
const ESP32_VID = 0x303A; //
const ESP32_PID = 0x1001; //

document.getElementById('btnConnect').onclick = async () => {
    try {
        const log = (msg) => document.getElementById('terminal').innerHTML += msg + "<br>";
        
        // Dùng WebUSB thay vì Web Serial
        const device = await navigator.usb.requestDevice({
            filters: [{ vendorId: ESP32_VID, productId: ESP32_PID }]
        });

        await device.open();
        await device.selectConfiguration(1);
        
        // Trên ESP32-C3/S3, Interface 0 thường là Serial
        // Nếu không được, hãy thử thay số 0 thành 2
        await device.claimInterface(0); 

        log("Kết nối thành công tới: " + device.productName);

        while (true) {
            // Endpoint 1 là cổng nhận dữ liệu phổ biến của ESP USB
            const result = await device.transferIn(1, 64);
            const decoder = new TextDecoder();
            log("> " + decoder.decode(result.data));
        }
    } catch (e) {
        alert("Lỗi: " + e.message);
    }
};
</script>
</body>
</html>
